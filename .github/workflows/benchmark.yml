name: Benchmark

on:
  push:
    branches: [main, ci/add-benchmark-workflow]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Benchmark (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eidos-embedding-model-${{ runner.os }}
          restore-keys: eidos-embedding-model-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark
        run: node dist/cli/index.js benchmark