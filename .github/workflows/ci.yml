name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eidos-embedding-model-${{ runner.os }}
          restore-keys: eidos-embedding-model-

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify build output
        run: node -e "const fs=require('fs');['dist/cli/index.js','dist/store/index.js'].forEach(f=>{if(!fs.existsSync(f))throw new Error('Missing: '+f)});console.log('Build output verified');"

      - name: Run tests
        run: npm run test

      - name: Doctor check
        run: node dist/cli/index.js doctor
        env:
          EIDOS_WORKSPACE: ${{ runner.temp }}/eidos-test-workspace
