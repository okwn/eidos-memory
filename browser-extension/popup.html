<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eidos Memory</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="url(#grad)" stroke-width="2"/>
          <path d="M8 12l2 2 4-4" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
              <stop offset="0%" stop-color="#667eea"/>
              <stop offset="100%" stop-color="#764ba2"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="title">Eidos Memory</span>
      </div>
      <div class="daemon-status" id="daemon-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </div>

    <!-- Toggle -->
    <div class="toggle-section">
      <label class="toggle-label">
        <span>Enable enrichment</span>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <!-- Stats -->
    <div class="stats-section" id="stats-section">
      <div class="stat">
        <span class="stat-value" id="stat-tokens">0</span>
        <span class="stat-label">Tokens Saved</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-dollars">$0</span>
        <span class="stat-label">$ Saved</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-prompts">0</span>
        <span class="stat-label">Prompts Wrapped</span>
      </div>
    </div>

    <!-- Budget slider -->
    <div class="budget-section">
      <label class="budget-label">
        <span>Context Budget</span>
        <span class="budget-value" id="budget-value">2000 tokens</span>
      </label>
      <input type="range" id="budget-slider" min="500" max="8000" step="500" value="2000">
    </div>

    <!-- Footer -->
    <div class="footer">
      <button id="btn-dashboard" class="btn-link">Open Dashboard</button>
      <span class="separator">|</span>
      <button id="btn-index" class="btn-link">Index Project</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
