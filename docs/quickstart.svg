<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
      .sans { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bg)" rx="16"/>
  <rect width="900" height="560" fill="none" stroke="#2a2d3e" stroke-width="1.5" rx="16"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="72" fill="#1a1d27" rx="16"/>
  <rect x="0" y="56" width="900" height="16" fill="#1a1d27"/>
  <rect x="28" y="22" width="4" height="28" fill="url(#accent)" rx="2"/>

  <!-- Logo + title -->
  <text x="44" y="44" class="sans" font-size="26" font-weight="700" fill="#6366f1" filter="url(#glow)">⚡ EidosCore</text>
  <text x="178" y="44" class="sans" font-size="15" fill="#64748b">Universal AI Memory Engine — Quick Start</text>
  <text x="820" y="44" class="sans" font-size="12" fill="#64748b" text-anchor="middle">v0.1.0</text>

  <!-- Step boxes -->
  <!-- Step 1 -->
  <rect x="28" y="92" width="190" height="180" fill="#1e2130" rx="10" stroke="#2a2d3e" stroke-width="1"/>
  <rect x="28" y="92" width="190" height="6" fill="url(#accent)" rx="5"/>
  <text x="123" y="116" class="sans" font-size="11" fill="#6366f1" font-weight="600" text-anchor="middle">STEP 1 — INSTALL</text>
  <text x="42" y="142" class="mono" font-size="12" fill="#10b981">npm install -g eidos-memory</text>
  <text x="42" y="168" class="mono" font-size="12" fill="#64748b"># or with npx (no install)</text>
  <text x="42" y="186" class="mono" font-size="12" fill="#10b981">npx eidos-memory doctor</text>
  <text x="42" y="214" class="sans" font-size="11" fill="#94a3b8">Verifies Node ≥20, SQLite,</text>
  <text x="42" y="230" class="sans" font-size="11" fill="#94a3b8">WASM grammars, adapters,</text>
  <text x="42" y="246" class="sans" font-size="11" fill="#94a3b8">and write permissions.</text>

  <!-- Step 2 -->
  <rect x="234" y="92" width="190" height="180" fill="#1e2130" rx="10" stroke="#2a2d3e" stroke-width="1"/>
  <rect x="234" y="92" width="190" height="6" fill="url(#accent)" rx="5"/>
  <text x="329" y="116" class="sans" font-size="11" fill="#6366f1" font-weight="600" text-anchor="middle">STEP 2 — INIT</text>
  <text x="248" y="142" class="mono" font-size="12" fill="#10b981">eidos init --global</text>
  <text x="248" y="168" class="sans" font-size="11" fill="#94a3b8">• Creates ~/.eidos/</text>
  <text x="248" y="186" class="sans" font-size="11" fill="#94a3b8">• Installs git post-commit hook</text>
  <text x="248" y="204" class="sans" font-size="11" fill="#94a3b8">• Patches PowerShell profile</text>
  <text x="248" y="222" class="sans" font-size="11" fill="#94a3b8">• Creates .eidosignore</text>
  <text x="248" y="246" class="sans" font-size="11" fill="#64748b">Run once per machine.</text>

  <!-- Step 3 -->
  <rect x="440" y="92" width="190" height="180" fill="#1e2130" rx="10" stroke="#2a2d3e" stroke-width="1"/>
  <rect x="440" y="92" width="190" height="6" fill="url(#accent)" rx="5"/>
  <text x="535" y="116" class="sans" font-size="11" fill="#6366f1" font-weight="600" text-anchor="middle">STEP 3 — INDEX</text>
  <text x="454" y="142" class="mono" font-size="12" fill="#10b981">eidos index .</text>
  <text x="454" y="168" class="sans" font-size="11" fill="#94a3b8">Parses your codebase with</text>
  <text x="454" y="186" class="sans" font-size="11" fill="#94a3b8">tree-sitter WASM grammars.</text>
  <text x="454" y="204" class="sans" font-size="11" fill="#94a3b8">Embeds 384-dim vectors.</text>
  <text x="454" y="222" class="sans" font-size="11" fill="#94a3b8">Stored in SQLite knowledge</text>
  <text x="454" y="240" class="sans" font-size="11" fill="#94a3b8">hypergraph at ~/.eidos/.</text>

  <!-- Step 4 -->
  <rect x="646" y="92" width="226" height="180" fill="#1e2130" rx="10" stroke="#2a2d3e" stroke-width="1"/>
  <rect x="646" y="92" width="226" height="6" fill="url(#accent)" rx="5"/>
  <text x="759" y="116" class="sans" font-size="11" fill="#6366f1" font-weight="600" text-anchor="middle">STEP 4 — USE</text>
  <text x="660" y="142" class="mono" font-size="12" fill="#10b981">eidos wrap claude "fix bug"</text>
  <text x="660" y="164" class="mono" font-size="12" fill="#10b981">eidos wrap aider "refactor"</text>
  <text x="660" y="186" class="mono" font-size="12" fill="#10b981">eidos proxy  # OpenAI compat</text>
  <text x="660" y="208" class="mono" font-size="12" fill="#10b981">eidos dash   # web explorer</text>
  <text x="660" y="232" class="sans" font-size="11" fill="#94a3b8">Context auto-injected.</text>
  <text x="660" y="248" class="sans" font-size="11" fill="#64748b">No code changes needed.</text>

  <!-- Feature pills row -->
  <rect x="28" y="296" width="844" height="64" fill="#151720" rx="10" stroke="#2a2d3e" stroke-width="1"/>
  <!-- pills -->
  <rect x="40"  y="310" width="112" height="28" fill="#1e2130" rx="14" stroke="#6366f1" stroke-width="1"/>
  <text x="96"  y="328" class="sans" font-size="11" fill="#a5b4fc" text-anchor="middle">🔒 Privacy Firewall</text>
  <rect x="162" y="310" width="112" height="28" fill="#1e2130" rx="14" stroke="#6366f1" stroke-width="1"/>
  <text x="218" y="328" class="sans" font-size="11" fill="#a5b4fc" text-anchor="middle">🧠 Vector Search</text>
  <rect x="284" y="310" width="120" height="28" fill="#1e2130" rx="14" stroke="#6366f1" stroke-width="1"/>
  <text x="344" y="328" class="sans" font-size="11" fill="#a5b4fc" text-anchor="middle">📦 QMS Seeds</text>
  <rect x="414" y="310" width="126" height="28" fill="#1e2130" rx="14" stroke="#6366f1" stroke-width="1"/>
  <text x="477" y="328" class="sans" font-size="11" fill="#a5b4fc" text-anchor="middle">🔁 CRDT Sync</text>
  <rect x="550" y="310" width="130" height="28" fill="#1e2130" rx="14" stroke="#6366f1" stroke-width="1"/>
  <text x="615" y="328" class="sans" font-size="11" fill="#a5b4fc" text-anchor="middle">🌡 Adaptive Budget</text>
  <rect x="690" y="310" width="126" height="28" fill="#1e2130" rx="14" stroke="#6366f1" stroke-width="1"/>
  <text x="753" y="328" class="sans" font-size="11" fill="#a5b4fc" text-anchor="middle">📊 Dashboard</text>

  <!-- Stats highlight row -->
  <rect x="28" y="378" width="270" height="80" fill="#0d1f17" rx="10" stroke="#10b981" stroke-width="1"/>
  <text x="163" y="402" class="sans" font-size="11" fill="#10b981" font-weight="600" text-anchor="middle">TOKEN SAVINGS</text>
  <text x="163" y="432" class="sans" font-size="28" font-weight="800" fill="#10b981" text-anchor="middle">up to 98%</text>
  <text x="163" y="450" class="sans" font-size="10" fill="#64748b" text-anchor="middle">typical session with indexed project</text>

  <rect x="312" y="378" width="270" height="80" fill="#1a1224" rx="10" stroke="#8b5cf6" stroke-width="1"/>
  <text x="447" y="402" class="sans" font-size="11" fill="#a78bfa" font-weight="600" text-anchor="middle">SUPPORTED TOOLS</text>
  <text x="447" y="430" class="sans" font-size="13" fill="#c4b5fd" text-anchor="middle">claude · gemini · aider · llm</text>
  <text x="447" y="450" class="sans" font-size="13" fill="#c4b5fd" text-anchor="middle">sgpt · mods · interpreter · qwen</text>

  <rect x="596" y="378" width="276" height="80" fill="#111827" rx="10" stroke="#6366f1" stroke-width="1"/>
  <text x="734" y="402" class="sans" font-size="11" fill="#818cf8" font-weight="600" text-anchor="middle">MCP CONFIG</text>
  <text x="734" y="422" class="mono" font-size="10" fill="#93c5fd" text-anchor="middle">{ "command": "eidos",</text>
  <text x="734" y="438" class="mono" font-size="10" fill="#93c5fd" text-anchor="middle">  "args": ["mcp"] }</text>
  <text x="734" y="453" class="sans" font-size="10" fill="#64748b" text-anchor="middle">Add to your MCP client config</text>

  <!-- Footer -->
  <rect x="0" y="488" width="900" height="72" fill="#1a1d27"/>
  <rect x="0" y="488" width="900" height="1" fill="#2a2d3e"/>
  <text x="450" y="516" class="sans" font-size="13" fill="#64748b" text-anchor="middle">
    📖 Full docs: github.com/eidos-memory/eidos-core
  </text>
  <text x="450" y="538" class="mono" font-size="11" fill="#4b5563" text-anchor="middle">
    eidos demo · eidos doctor · eidos stats · eidos replay · eidos branch · eidos nightly
  </text>
</svg>
